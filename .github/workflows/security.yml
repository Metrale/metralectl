# SPDX-License-Identifier: MIT OR Apache-2.0
name: Security

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  schedule:
    # Advisories land between our commits, so check on a timer too.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.93.1"
          # The root Cargo.toml is itself a package, so without --workspace
          # cargo-deny checks only its 4 dependencies, not the agent and CLI.
          arguments: --workspace --all-features
          command: check advisories licenses sources bans
