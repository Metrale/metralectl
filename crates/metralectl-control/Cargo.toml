# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metralectl-control"
description = "The metralectl lifecycle core: closed control verbs, idempotent launcher, bounded retry. No network surface."
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# This crate is embedded in-process by hosts that own their own network
# surface, so it must stay free of web-server, TLS, service-discovery and
# telemetry-transport dependencies. `scripts/check-control-deps.sh` enforces it.
[dependencies]
metralectl-core.workspace = true
metralectl-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
sha2.workspace = true
tokio = { version = "1", features = ["rt", "time"] }
# Release signatures (document-signature.v1): the crates and versions Metrale/mfs
# signs and verifies with (metrale-crypto), so both sides run one implementation.
# Pure Rust, Apache-2.0 OR MIT, no network surface. Pinned exactly: pre-1.0
# signature code whose encodings must not move under the platform's.
ed25519-dalek = { version = "=3.0.0", default-features = false }
ml-dsa = { version = "=0.1.1", default-features = false }
sha3 = { version = "=0.12.0", default-features = false }

[dev-dependencies]
# The recording mocks are feature-gated so they never ship in a release build.
metralectl-core = { workspace = true, features = ["test-mocks"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde_norway.workspace = true

[features]
test-mocks = []

[lints]
workspace = true
