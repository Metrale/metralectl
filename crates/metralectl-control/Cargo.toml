# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "metralectl-control"
description = "The metralectl lifecycle core: closed control verbs, idempotent launcher, bounded retry. No network surface."
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# This crate is embedded in-process by hosts that own their own network
# surface, so it must stay free of web-server, TLS, service-discovery and
# telemetry-transport dependencies. `scripts/check-control-deps.sh` enforces it.
[dependencies]
metralectl-core.workspace = true
metralectl-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
# The recording mocks are feature-gated so they never ship in a release build.
metralectl-core = { workspace = true, features = ["test-mocks"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde_yaml_ng.workspace = true

[features]
test-mocks = []

[lints]
workspace = true
