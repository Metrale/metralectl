# SPDX-License-Identifier: AGPL-3.0-only
#
# Packages the Rust binary as a Python wheel so `uvx pymetralectl` works with no
# install step. There is no Python code here: maturin's `bin` bindings put the
# compiled executable straight into the wheel's scripts directory.
#
# The distribution is named `pymetralectl` (a `py`-prefixed wheel name kept
# distinct from the crate). The console script keeps the real name, so
# `uv tool install pymetralectl` still gives you `metralectl` on PATH.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pymetralectl"
description = "Launch Metrale Engine inference recipes on NVIDIA DGX Spark and other local accelerators."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
keywords = ["llm", "inference", "dgx-spark", "gb10", "metrale"]
classifiers = [
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://dev.metrale.ai"
Repository = "https://github.com/Metrale/metrale-recipes"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
# The binary is self-contained, so the wheel carries no Python ABI tag.
strip = true
