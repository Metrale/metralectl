# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Packages the Rust binary as a Python wheel so `uvx metralectl` works with no
# install step. There is no Python code here: maturin's `bin` bindings put the
# compiled executable straight into the wheel's scripts directory.
#
# The distribution and the console script share the crate's name, which is what
# lets `uvx metralectl` find the executable without `--from`.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "metralectl"
description = "Launch Metrale Engine inference recipes on NVIDIA DGX Spark and other local accelerators."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
keywords = ["llm", "inference", "dgx-spark", "gb10", "metrale"]
classifiers = [
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://metrale.ai/engine"
Repository = "https://github.com/Metrale/metralectl"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
# The binary is self-contained, so the wheel carries no Python ABI tag.
strip = true
